name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
      - run: go version
      - name: Cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

  version:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: go version

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: go tool golangci-lint run

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: go build -o dist/ ./cmd/...

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: go test ./... -v -coverprofile=coverage.out -covermode=atomic
      - uses: k1LoW/octocov-action@v1

  livesync-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        working-directory: livesync-bridge
        run: deno install --frozen

      - name: Check
        working-directory: livesync-bridge
        run: deno task check

      - name: Lint
        working-directory: livesync-bridge
        run: deno task lint

      - name: Test
        working-directory: livesync-bridge
        run: deno task test

      - name: Build Docker image
        working-directory: livesync-bridge
        run: docker build --tag localhost/livesync-bridge:ci .
